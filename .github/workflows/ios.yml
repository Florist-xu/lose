name: iOS IPA

# ios/ 下的壳工程有改动时自动构建;也可以在 Actions 页面手动运行
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project GenLian.xcodeproj -target GenLian -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/GenLian.app Payload/
          zip -qry GenLian.ipa Payload
          ls -lh GenLian.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GenLian-ipa
          path: ios/GenLian.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-${{ github.run_number }}" ios/GenLian.ipa \
            --title "跟练打卡 iOS #${{ github.run_number }}" \
            --notes "未签名 IPA,需要用 爱思助手 / Sideloadly / AltStore 用自己的 Apple ID 签名后安装。界面和功能从服务器在线加载,服务器更新后重新打开 App 即生效,一般无需重装。" \
            --latest
