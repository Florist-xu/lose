<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跟练打卡 · 5组动作识别</title>
<style>
:root{--bg:#10141c;--card:#1a2130;--fg:#eef2f8;--mut:#8b97ab;--ac:#ffd23f;--ok:#3ddc84;--bad:#ff6b6b;--line:#2a3447}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:160px}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;max-width:1280px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam.mirror,#overlay.mirror{transform:scaleX(-1)}
.hud{position:absolute;left:0;right:0;top:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 6px #000}
.hud .t{font-size:16px;color:var(--ac);font-weight:700}.hud .n{font-size:22px;font-weight:800}
.count{position:absolute;right:16px;bottom:12px;font-size:92px;font-weight:900;color:var(--ac);line-height:1;text-shadow:0 3px 12px #000;pointer-events:none}
.count small{font-size:30px;color:#fff}
.msg{position:absolute;left:16px;bottom:16px;max-width:60%;padding:8px 12px;border-radius:8px;background:#000a;font-size:15px;pointer-events:none}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.big{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000b;text-align:center;padding:20px}
.big .cd.small{font-size:84px}.bigBtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}.big.show{display:flex}.big .h{font-size:34px;font-weight:800;color:var(--ac)}.big .s{font-size:18px;margin-top:8px}.big .cd{font-size:120px;font-weight:900}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.ref{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:9/16;max-height:320px;margin:0 auto}
.ref video{width:100%;height:100%;object-fit:contain}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{background:#0003;border-radius:8px;padding:8px}
.stats b{display:block;font-size:22px;color:var(--ac)}.stats span{font-size:12px;color:var(--mut)}
.chips{display:grid;grid-template-columns:auto repeat(4,1fr);gap:4px;align-items:center;font-size:12px}
.chip{padding:5px 2px;text-align:center;border-radius:6px;background:#0003;border:1px solid transparent;color:var(--mut);cursor:pointer}
.chip.cur{border-color:var(--ac);color:var(--ac)}.chip.done{background:#3ddc8433;color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap}label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.fsbar{display:none;position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));justify-content:center;gap:8px;z-index:5}
.fsbar button{background:#000a;backdrop-filter:blur(4px);padding:8px 14px}
body:has(.stage.full){overflow:hidden}
.stage.full{position:fixed;inset:0;z-index:40;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0}
.stage.full video,.stage.full canvas{object-fit:contain}
.stage.full .fsbar,.stage.live .fsbar{display:flex}
.stage.live:not(.full) .fsbar{top:74px;bottom:auto;left:16px;right:auto;justify-content:flex-start}
.stage.live:not(.full) .fsbar button:not(#fsExit){display:none}
body:has(.stage.full) #refCard{position:fixed;z-index:45;left:calc(12px + env(safe-area-inset-left));bottom:calc(64px + env(safe-area-inset-bottom));width:96px;padding:0;border:2px solid var(--ac);background:#000;border-radius:8px;overflow:hidden;pointer-events:none;box-shadow:0 2px 10px #000a}
body:has(.stage.full) #refCard h3{display:none}
body:has(.stage.full) #refCard .ref{max-height:none;border-radius:0}
body.hideRef:has(.stage.full) #refCard{display:none}
body:not(.hideRef) .stage.full .msg{left:calc(122px + env(safe-area-inset-left));max-width:calc(100% - 270px)}
.stage.full .hud{padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left))}
.stage.full .count{bottom:calc(64px + env(safe-area-inset-bottom));right:calc(16px + env(safe-area-inset-right))}
.stage.full .msg{bottom:calc(64px + env(safe-area-inset-bottom));left:calc(16px + env(safe-area-inset-left))}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal.show{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.mbox h2{margin:0 0 10px;font-size:20px}.mbox .sub{color:var(--mut);font-size:13px;margin:4px 0 10px}
.mbox .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.mbox .kv div{background:#0003;border-radius:8px;padding:8px}
.mbox .kv b{display:block;font-size:20px;color:var(--ac)}.mbox .kv span{font-size:12px;color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.thumbs figure{margin:0;text-align:center;font-size:11px;color:var(--mut)}.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:#000;display:block}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.btns button{flex:1;min-width:110px;padding:11px}
.btns .danger{border-color:var(--bad);color:var(--bad)}
.dayrow{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;background:#0003;margin-bottom:6px;cursor:pointer}
.dayrow:hover{outline:1px solid var(--ac)}.sess{border-top:1px solid var(--line);padding:10px 0}
.note{font-size:13px;margin-top:8px}.note.ok{color:var(--ok)}.note.bad{color:var(--bad)}
.dbg{font:11px/1.5 Consolas,monospace;color:var(--mut);white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1 id="title">🏋️ 跟练打卡</h1>
  <label>项目<select id="wsel"></select></label>
  <label><input type="checkbox" id="mirror" checked>镜像</label>
  <label><input type="checkbox" id="sound" checked>音乐 <span id="bgmState"></span></label>
  <label>识别<select id="sens"><option value="1.4">严格</option><option value="1.8" selected>标准</option><option value="2.6">宽松</option></select></label>
  <label><input type="checkbox" id="debug">调试</label>
  <button id="btnMusic">休息音乐</button>
  <button id="btnHistory">历史记录</button>
  <button id="btnEnd" disabled>结束训练</button>
  <button id="btnPause" disabled>暂停</button>
  <button id="btnSkip" disabled>跳过本动作</button>
  <button class="pri" id="btnStart">开启摄像头并开始</button>
</header>
<main>
  <section>
    <div class="stage">
      <video id="cam" playsinline muted class="mirror"></video>
      <canvas id="overlay" class="mirror"></canvas>
      <div class="hud"><div><div class="t" id="hGroup">第一组</div><div class="n" id="hMove">胯下击掌</div></div>
        <div style="text-align:right"><div class="t">本动作用时</div><div class="n" id="hTimer">00:00</div></div></div>
      <div class="count"><span id="cnt">0</span><small id="cntMax">/20</small></div>
      <div class="msg" id="msg">点击右上角"开启摄像头并开始"</div>
      <div class="fsbar"><button id="fsRef">隐藏示范</button><button id="fsPause">暂停</button><button id="fsSkip">跳过</button><button id="fsEnd">结束</button><button id="fsExit">退出全屏</button></div>
      <div class="big" id="big"><div class="h" id="bigH"></div><div class="cd" id="bigCd"></div><div class="s" id="bigS"></div>
        <div class="bigBtns" id="bigBtns" style="display:none"><button id="bSkipRest" class="pri">跳过休息</button><button id="bPauseMusic">⏸ 音乐</button><button id="bNextTrack">下一首</button></div></div>
    </div>
    <div class="card dbg" id="dbgBox" style="margin-top:12px;display:none"></div>
  </section>
  <aside>
    <div class="card" id="refCard"><h3>示范画面(声音由独立音频播放)</h3><div class="ref"><video id="ref" playsinline preload="auto"></video></div></div>
    <div class="card"><h3>进度</h3>
      <div class="stats"><div><b id="sTotal">00:00</b><span>总用时</span></div><div><b id="sDone">0/0</b><span>已完成动作</span></div>
      <div><b id="sL">0</b><span>左腿有效次数</span></div><div><b id="sR">0</b><span>右腿有效次数</span></div></div></div>
    <div class="card"><h3>点击可跳转到任意动作</h3><div class="chips" id="chips"></div></div>
  </aside>
</main>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<audio id="restAudio" preload="auto" playsinline></audio>
<audio id="bgm" preload="auto"></audio>
<script type="module" src="app.js"></script>
</body>
</html>
